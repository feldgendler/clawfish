name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  workflow_dispatch:

# Cancel in-progress runs for the same ref on PR branches; let main runs
# complete so we always have a green/red signal per commit on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon is the primary target; Linux runs as a portability
        # check (per CLAUDE.md "Architectural commitments").
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  fuzz-check:
    name: fuzz check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - run: cd fuzz && cargo fmt --all -- --check
      - run: cd fuzz && cargo check --locked --all-targets

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # `--lib` only: the 1848 lib unit tests give ~93% line coverage.
      # Heavy corpus integration tests (corpus_per_game_file, crash_safety,
      # reproducibility) under coverage instrumentation took ~36 of ~40 min
      # of wallclock — disproportionate cost for marginal coverage delta
      # (they exercise cross-module orchestration over code already covered
      # by lib unit tests). They still run in the `test` job above.
      # `--ignore-run-fail` keeps coverage informational rather than gating.
      - run: cargo llvm-cov --lib --locked --summary-only --ignore-run-fail
