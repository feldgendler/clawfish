name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'docs/**'
  workflow_dispatch:

# Cancel in-progress runs for the same ref on PR branches; let main runs
# complete so we always have a green/red signal per commit on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon is the primary target; Linux runs as a portability
        # check (per CLAUDE.md "Architectural commitments").
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Two test runs, both via nextest (process-per-test, parallel across cores):
      #
      # 1. DEBUG lib suite. The full suite below builds optimized, which (a)
      #    compiles out `debug_assert!`/`debug_assertions` — including the
      #    per-move `Position::debug_assert_consistent` board-consistency scan —
      #    and (b) drops the `#[cfg(debug_assertions)]` `#[should_panic]` guard
      #    tests that prove those invariants fire. This fast debug `--lib` run
      #    (~46 s; no heavy self-play integration tests are in `--lib`) keeps that
      #    coverage cross-platform. It is NOT redundant with run 2.
      #
      #    `production_worker_tests` (lib unit tests) spawn the `mock-engine`
      #    `[[bin]]` fixture by walking `current_exe()` to `target/debug/`.
      #    `nextest run --lib` does NOT build `[[bin]]` targets, so the fixture
      #    must be built explicitly first — otherwise its presence is
      #    cache-dependent and the tests panic with "could not find mock-engine"
      #    on a cache miss (the flake that reddened main after the nextest
      #    adoption). The optimized full suite below builds all targets, so it
      #    needs no such step. (CARGO_BIN_EXE_* is unavailable to lib unit tests,
      #    so the path-walk + explicit build is the correct pattern here.)
      - run: cargo build --locked --bin mock-engine
      - run: cargo nextest run --locked --lib --profile ci
      # 2. FULL suite under `release-checked` (optimized + overflow-checks). Built
      #    optimized so the heavy self-play integration tests run in seconds, not
      #    the tens of seconds a debug build takes (which oversubscribes the runner
      #    under nextest's parallelism — that slowness is itself caused by the
      #    per-move debug-assert scan, so a debug full suite is not an option here).
      #    overflow-checks stay ON. nextest does NOT run doctests — the `--doc`
      #    step below stays. Benches get a compile check via `clippy --all-targets`.
      - run: cargo nextest run --locked --cargo-profile release-checked --profile ci
      - run: cargo test --locked --doc

  fuzz-check:
    name: fuzz check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - run: cd fuzz && cargo fmt --all -- --check
      - run: cd fuzz && cargo check --locked --all-targets

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # `--lib` only: the 1848 lib unit tests give ~93% line coverage.
      # Heavy corpus integration tests (corpus_per_game_file, crash_safety,
      # reproducibility) under coverage instrumentation took ~36 of ~40 min
      # of wallclock — disproportionate cost for marginal coverage delta
      # (they exercise cross-module orchestration over code already covered
      # by lib unit tests). They still run in the `test` job above.
      # `--ignore-run-fail` keeps coverage informational rather than gating.
      #
      # Like the `test` job, the `production_worker_tests` (lib) spawn the
      # `mock-engine` [[bin]] fixture, which `--lib` does not build. cargo-llvm-cov
      # builds into its OWN `target/llvm-cov-target` dir (not `target/debug`) and
      # wipes stray artifacts at startup — so a plain pre-build there gets deleted.
      # The working sequence: drop stale profraw, build the fixture INTO that dir,
      # then run with `--no-clean` so the fixture survives the run. Without this the
      # fixture tests panic ("could not find mock-engine") and contribute no
      # coverage; `--ignore-run-fail` masks that to keep the job green, but the
      # data is then missing. (`target/llvm-cov-target` is cargo-llvm-cov's default
      # build dir; if a future version changes it, only this non-gating job breaks,
      # visibly.)
      - run: cargo llvm-cov clean --profraw-only
      - run: cargo build --locked --bin mock-engine --target-dir target/llvm-cov-target
      - run: cargo llvm-cov --lib --locked --summary-only --ignore-run-fail --no-clean
