# cargo-deny configuration.
# Run: `cargo deny check`
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
# This crate is `publish = false` and has no `license` declared — skip its own check.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    # Permissive licenses pulled in by the non-default `corpus-fetch` feature's
    # network/decompression stack (checked here because the `deny` CI job runs
    # `--all-features`). All four are non-copyleft and OSI/FSF-recognized:
    "Zlib",                # zlib-rs -> flate2 -> zip (OSI-approved, FSF Free)
    "Unicode-3.0",         # unicode-ident (Unicode License v3, OSI-approved)
    "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs (Mozilla CA bundle data, via ureq/rustls)
    "bzip2-1.0.6",         # libbz2-rs-sys -> bzip2 -> sevenz-rust2 (BSD-style)
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
