    # ---- M5.C: late_move_reduction in-domain guard `||` → `&&` -----------
    #
    # `late_move_reduction(depth, quiet_index)` opens with:
    #   if depth < LMR_MIN_DEPTH || quiet_index < LMR_MIN_QUIET_INDEX {
    #       return 0;
    #   }
    # The `||` → `&&` mutation falls through to the formula path on inputs
    # the original would have short-circuited. PROVABLY EQUIVALENT for every
    # input the function receives:
    #   - quiet_index = 0 or 1: ln(quiet_index) is ln(0) = -inf or ln(1) = 0.
    #     Either way, the multiplicative formula `ln(d) * ln(qi) / 3.14` is
    #     0 or -inf. floor(0.99 + 0) = 0; floor(0.99 + (-inf)) = -inf, which
    #     `as u32` saturates to 0. Then clamp(0, 0, depth.saturating_sub(2))
    #     returns 0.
    #   - depth = 0, 1, or 2: depth.saturating_sub(2) returns 0, so the
    #     final clamp returns 0 regardless of the formula's output.
    # In short, the formula path coincidentally produces 0 for exactly the
    # inputs the early-return guard catches. The `||` guard is defense-in-
    # depth, not load-bearing for any reachable input. A line-anchored
    # exclusion would rot if the helper is refactored, so the rule is
    # function-anchored — there is only one `||` in this helper.
    "replace \\|\\| with && in late_move_reduction",

