    # LMR_LOG_DIVISOR=3.14) the resulting reductions diverge from the
    # original at large (depth, quiet_index) inputs, but the differences
    # are absorbed by the `clamp(0, depth - 2)` post-step at every input
    # the test suite reaches: at depth=3 the clamp ceiling is 1, and at
    # depth=8 the floor coincidentally lands on the same integer for both
    # the original and the mutated formula. STRUCTURALLY UNDETECTABLE at
