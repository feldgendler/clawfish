    # epsilon defends against future float-arithmetic upstream of the
    # callers, but every current caller passes scores produced by
    # `compute_clawfish_score`, which only emits {0.0, 0.5, 1.0} —
    # integer-valued doubles. For these inputs, `0.0 < 1e-9` and `0.0 <= 1e-9`
    # both true; `0.5 < 1e-9` and `0.5 <= 1e-9` both false; `1.0 < 1e-9` and
    # `1.0 <= 1e-9` both false. Same for the second branch with `s.abs()`.
    # No test input distinguishes `<` from `<=`. Equivalent.
    #
    # **EQUIVALENCE DEPENDS ON: callers passing only {0.0, 0.5, 1.0}.**
    # If a future code path ever calls `classify_score` with a score that
    # could be 1e-9 (e.g., a smoothed/weighted score), this equivalence
    # breaks and the exclusion must be re-evaluated.
    "replace < with <= in classify_score",

