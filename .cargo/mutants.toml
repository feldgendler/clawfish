# cargo-mutants configuration. See https://mutants.rs/.
#
# Mutation testing answers "would the test catch a bug here?" by mutating
# the source (e.g. `+` → `-`, `<` → `<=`) and reporting which mutants
# survive the test suite. Surviving mutants point at gaps in test coverage.
#
# Run with: cargo mutants
#
# ===========================================================================
# Triaging a single survivor — manual mutation + targeted test
# ===========================================================================
#
# When a survivor is reported and you need to understand WHY a test fails to
# catch it (or to iterate on candidate fixtures), don't re-run the full
# `cargo mutants` suite each time — that burns ~an hour per pass.
#
# Instead: apply the mutation by hand via Edit, run only the suspect test(s),
# revert. Cycle time: seconds per iteration.
#
#   1. Edit the source file to apply the mutation (e.g., delete a `-`,
#      change `+` to `-`).
#   2. `cargo test --lib <test_name_pattern>`
#   3. Test passes against broken code → fixture fails to catch; iterate.
#      Test fails → caught.
#   4. Revert the mutation in source.
#
# Fall back to full `cargo mutants --in-diff` only to confirm the final test
# surface catches what it should.
#
# ===========================================================================
# `exclude_re` rules — don't anchor on line numbers
# ===========================================================================
#
# `exclude_re` patterns match against cargo-mutants' display name for each
# mutant (typically `<file>:<line>:<col>: <op> in <function>`). It's tempting
# to disambiguate two same-shape mutants in the same function (e.g. two
# `delete -` mutants in `qsearch`) by anchoring the regex to a specific
# `:<line>:<col>:` prefix. DON'T.
#
# Line-anchored exclusions are fragile to refactoring:
#   - Any unrelated edit that shifts the line silently breaks the exclusion
#     (no error — the rule simply matches no mutant).
#   - A different mutation at the same line silently gets excluded
#     (false-negative).
# The exclusion's intent rots invisibly.
#
# Better approaches, in order of preference:
#
#   1. REFACTOR the bug-prone pattern into a named helper. When two same-
#      shape mutants in the same function are genuinely different bugs,
#      extracting one into a separate function gives cargo-mutants two
#      distinct function names. More importantly, the named helper is
#      directly unit-testable in isolation — often the structural reason
#      the mutation was hard to catch is *because* the bug-prone code is
#      mixed in with surrounding logic. M3.D's `negate_window(alpha, beta)`
#      precedent: the `(-beta, -alpha)` open-coded bound-negation in
#      qsearch's recursive call had two `delete -` mutations that were
#      structurally undetectable at the qsearch integration level (1-2
#      plies of recursion is too shallow to expose the effect). Extracting
#      `negate_window` made both mutations catchable by a 5-line
#      pure-function test.
#   2. Anchor on a distinctive token in the mutant's display (if cargo-
#      mutants surfaces source context).
#   3. Wrap the bug-prone call in a uniquely-named `#[inline]` shim function.
#   4. Document the gap explicitly and accept the over-filter — last resort.
#
# Avoid:
#   - `:<line>:<col>:` anchors. Line numbers shift on any edit.
#   - Broad function-level patterns (`<op> in <function>`) when the function
#     has multiple mutants of the same shape but different semantic targets
#     — the rule will silently over-filter sibling mutants.

# ---- File-level exclusions ------------------------------------------------
exclude_globs = [
    # Auto-generated constants. The data is verified end-to-end by the
    # gold-standard differential test in tests/magic_consistency.rs;
    # mutating individual hex literals would just produce noise.
    "src/magic/constants.rs",

    # The magicgen binary is a codegen tool, not engine code. It runs its
    # own validate() pass on every invocation and is not exercised by
    # cargo test, so every mutation here would survive trivially.
    "src/bin/magicgen.rs",

    # Stub entry point — println! only, nothing meaningful to mutate.
    "src/main.rs",

    # Vendored PeSTO middlegame evaluation data (M3.A): MATERIAL constants
    # plus six MG_*_PST tables. Same precedent as src/magic/constants.rs.
    # Mutation testing on negative literals would generate ~185 `delete -`
    # survivors that the structural symmetry test (B1 in src/eval.rs) is
    # invariant under (sign-flips on both color sides cancel). End-to-end
    # validation lives at higher layers — the published PeSTO source is
    # authoritative, and SPRT vs RandomMover (M3.F) plus the smoke games in
    # scripts/match.sh exercise the data in actual play.
    "src/eval/data.rs",
]

# ---- Mutant-level exclusions (by name regex) ------------------------------
#
# Patterns key on the mutant's `replace ... in <function>` form and so are
# robust to line moves within a function. Each block documents *why* the
# mutant is genuinely indistinguishable from the original — i.e. the test
# suite cannot catch it because no input differentiates the two operators
# (an "equivalent mutant" in mutation-testing terminology).
exclude_re = [
    # `replace <fn> -> () with ()` — no-op for unit-returning functions.
    "replace .* -> \\(\\) with \\(\\)",

    # ---- `|` ↔ `^` between provably-disjoint operands -----------------
    #
    # These functions OR together bitboards (or single-bit integer values)
    # that are disjoint by construction. For disjoint a, b: a | b == a ^ b
    # for every input, so no test can distinguish the two operators.

    # slow_attacks: each ray-combiner ORs four directional rays from one
    # square. The rays cover distinct cardinal/diagonal squares — they
    # never overlap (this is why a slider's attack set is the disjoint
    # union of its rays).
    "replace \\| with \\^ in rook_mask",
    "replace \\| with \\^ in bishop_mask",
    "replace \\| with \\^ in rook_attacks",
    "replace \\| with \\^ in bishop_attacks",
    # queen_attacks (both slow_attacks and magic) ORs rook-attacks with
    # bishop-attacks; rook attacks file/rank squares while bishops attack
    # diagonal squares — the two sets are always disjoint.
    "replace \\| with \\^ in queen_attacks",

    # Position::starting_position composes disjoint piece bitboards (each
    # piece type's white set is on rank 1, black set on rank 8; pawns on
    # rank 2/7) and disjoint rank ORs (RANK_1 | RANK_2, RANK_7 | RANK_8).
    "replace \\| with \\^ in Position::starting_position",

    # White-occupancy and black-occupancy are disjoint by definition —
    # no piece is both colors.
    "replace \\| with \\^ in Position::occupied_all",
    "replace \\| with \\^ in Position::debug_assert_consistent",

    # ---- ray_mask: first off-board guard `||` ↔ `&&` ------------------
    #
    # ray_mask exits the loop on either guard:
    #   if !(0..8).contains(&nf) || !(0..8).contains(&nr) { return acc; }
    #   ...
    #   if !(0..8).contains(&beyond_f) || !(0..8).contains(&beyond_r)
    #     { return acc; }
    # Mutating the FIRST guard's `||` to `&&` only matters if the first
    # guard would have fired but the second won't — which is impossible:
    # `beyond` is always one step further along (dfile, drank), so
    # whichever axis went off-board is more off-board on the next step,
    # and the second `||` (unchanged) catches it before
    # Square::from_file_rank is reached. So no input distinguishes.
    "replace \\|\\| with && in ray_mask",

    # ---- magic table-build destructive-collision check ---------------
    #
    # The committed magic constants produce a perfect-hash mapping for
    # every (square, subset) pair: each subset hits a unique slot, so the
    # `existing != 0` branch is never taken during table build with our
    # seed (0xC0FFEE_C0FFEE). The `panic!` guards a hypothetical corrupted
    # constants file. Since the branch is unreachable in practice, mutating
    # `!=` → `==` produces an equivalent mutant: both forms are unreachable,
    # and the test suite cannot distinguish them. (Keep the runtime check;
    # it's a cheap defense against future regeneration with a non-perfect
    # magic.)
    "replace != with == in build_rook_table",
    "replace != with == in build_bishop_table",

    # ---- masks: opponent rook+queen / bishop+queen unions ------------
    #
    # `pos.pieces_colored(c, Rook) | pos.pieces_colored(c, Queen)` ORs two
    # bitboards that share zero bits (a square holds a rook OR a queen,
    # not both). Same for bishop+queen. Disjoint by construction → `|` ≡
    # `^` for every input. Same applies to the assemble of pawn-attack
    # shifts inside `compute_attacked_squares` (NW and NE shifts are
    # never the same square because they differ in file by 2).
    "replace \\| with \\^ in checkers_of",
    "replace \\| with \\^ in compute_attacked_squares",
    "replace \\| with \\^ in MaskInfo::compute",
    "replace \\| with \\^ in emit_pawn_moves",

    # ---- masks::is_slider_at — equivalent on knight/pawn checker -----
    #
    # `is_slider_at` is consumed only inside MaskInfo::compute's
    # single-checker branch to pick `push_mask = between_bb(king,
    # checker)` vs `EMPTY`. For knight or pawn checkers (the only
    # non-slider checkers), the checker is never on a rank/file/diagonal
    # ray from the king at >1 distance — knight checks are L-jumps;
    # pawn checks are diagonally adjacent. In both cases `between_bb`
    # returns EMPTY regardless of `is_slider_at`, so mutating the fn to
    # always return `true` doesn't affect the resulting mask. Equivalent.
    "replace is_slider_at -> bool with true",

    # ---- knight/king attack-table builders: `+` ↔ `-` on symmetric deltas ----
    #
    # `build_knight_attacks` and `build_king_attacks` both iterate over a
    # deltas array that is closed under negation (knight: {(±2,±1),(±1,±2)};
    # king: {(±1,0),(0,±1),(±1,±1)}). Mutating `file + df` → `file - df` (or
    # the rank counterpart) only swaps which delta produces which target;
    # the SET of (target_file, target_rank) pairs is invariant under
    # negation of df (or dr). The resulting attack table is byte-identical,
    # and no test can distinguish. (Pawn-attack table is NOT in this class:
    # its offsets are constant per direction, not drawn from a closed-under-
    # negation set.)
    "replace \\+ with - in build_knight_attacks",
    "replace \\+ with - in build_king_attacks",

    # ---- TtEntry::pack_age_bound: `(age & 0x3F) << 2 | bound` disjoint ----
    #
    # `pack_age_bound(age, bound) = (age & 0x3F) << 2 | bound as u8`.
    # The left operand lives in bits [7..2] (age, 6 bits), the right in
    # bits [1..0] (bound, 2 bits). They have disjoint bit positions by
    # construction, so `|` and `^` produce identical results for every
    # input. Equivalent mutant; M4.A.
    "replace \\| with \\^ in TtEntry::pack_age_bound",

    # ---- emit_*_moves: `capture_mask | push_mask` is disjoint -----
    #
    # The single-check / no-check / double-check formulas guarantee
    # `capture_mask` and `push_mask` are always disjoint:
    #   - no check:    capture = enemy_occupied, push = empty_squares (∅ overlap)
    #   - single check: capture = {checker_sq}, push = between_bb(king, checker)
    #     (between excludes endpoints, so checker_sq ∉ between)
    #   - double check: both EMPTY
    # So `mask | mask` ≡ `mask ^ mask` for every emit. Equivalent.
    "replace \\| with \\^ in emit_knight_moves",
    "replace \\| with \\^ in emit_slider_moves",

    # ---- pawn.rs: 2 * push_dr equivalent under push_dr ∈ {-1, +1} ----
    #
    # `(from_rank as i8 + 2 * push_dr) as u8` is the double-push target
    # rank. push_dr is hardcoded to ±1. For x ∈ {-1, +1}: 2 * x == 2 / x
    # (both yield ±2). Equivalent for the only inputs that ever appear.
    "replace \\* with / in emit_pawn_moves",

    # ---- AlphaBetaMover::qsearch — assignment guards equivalent on equality
    #
    # Several guards in qsearch fire on strict greater-than:
    #   `if sp > alpha { alpha = sp; }`     (stand-pat alpha-tightening, L547)
    #   `if score > best { best = score; }` (move-loop best-tracking, L599)
    #   `if score > alpha { alpha = score; }` (move-loop alpha-tightening, L601)
    # Mutating `>` to `>=` makes the guard fire on equality too. But on
    # equality, the assignment is a no-op (alpha = alpha is identity, etc.),
    # so the post-condition is identical. No test input can distinguish.
    # The same `>=` variant of `>` and the `==`-only mutant for `sp > alpha`
    # are also equivalent for this reason.
    "replace > with >= in AlphaBetaMover::qsearch",
    "replace > with == in AlphaBetaMover::qsearch",

    # ---- AlphaBetaMover::qsearch — MD-pruning trigger boundary ---------
    #
    # `if mating_value < beta { beta = mating_value; if alpha >= mating_value { return mating_value; } }`
    # at L516. Mutating `<` to `<=` makes the outer guard fire when
    # mating_value == beta. In that case the inner `beta = mating_value`
    # assignment is a no-op (beta == beta), and the inner check
    # `alpha >= mating_value` is a function of (alpha, mating_value) only —
    # unchanged. So `<` ≡ `<=` here.
    "replace < with <= in AlphaBetaMover::qsearch",

    # ---- AlphaBetaMover::qsearch — cancellation cadence operator ------
    #
    # `if self.nodes & 4095 == 0 && ctx.should_abort(...)` at L506. Mutating
    # `&` to `^` switches the gate's predicate. Both gates are inert under
    # the test surface: `n & 4095 == 0` fires only when nodes is a multiple
    # of 4096; `n ^ 4095 == 0` fires only when nodes equals 4095 exactly.
    # M3.D tests don't run long enough to reach either set, so neither
    # version of the gate ever triggers ctx.should_abort within the test
    # suite. The same `&` cadence is also present in negamax (M3.C
    # precedent — also untreated by an exclusion since no test distinguishes).
    "replace & with \\^ in AlphaBetaMover::qsearch",

    # ---- ELOH.A: integration-only paths — smoke-test exercised ----------
    #
    # The Elo-iteration harness (`src/bin/elo-iterate.rs`) has substantial
    # surface that is structurally only reachable through `main()` orchestrating
    # real subprocess pairs over stdin/stdout pipes. Unit tests cover the
    # pure helpers (CLI parser, adjudicate, PGN formatter, time-clock
    # arithmetic, parser line-by-line) — but `main`, `play_one_game`, the
    # post-handshake `wait_for_uciok`/`wait_for_readyok` drains, the `shutdown`
    # subprocess teardown, `send_line` writeline-with-flush, and
    # `append_summary_line` file-IO are exercised end-to-end by the
    # `#[ignore]`-gated `e2e_smoke::end_to_end_clawfish_self_play_4_games`
    # plus the manual back-test (200 games vs Stockfish UCI_Elo=1320 archived
    # in `docs/research/tooling-elo-harness-validation.md`).
    #
    # Mutating any of these to a degenerate `Ok(())` / no-op / sign-flip is
    # caught by the smoke test (which the integration coverage gate runs
    # manually before each ELOH milestone closure) but NOT by `cargo test`.
    # `cargo mutants --in-diff` therefore reports them as missed under the
    # default test invocation. Excluding them here documents the structural
    # gap explicitly. The complementary tests remain the smoke + manual
    # back-test; ELOH.B is expected to add a non-ignored mini-smoke (one
    # 2-game self-play) to close part of this gap.
    "in match_loop::play_one_game",
    "in main$",
    "in driver::wait_for_uciok",
    "in driver::wait_for_readyok",
    "in driver::shutdown$",
    "in driver::send_line",
    "<impl Drop for EngineHandle>",
    "in summary::append_summary_line",
    "in get_hostname",
    "in cli::<impl std::fmt::Display for CliError>::fmt",

    # ---- ELOH.A: documentation comment, NOT a regex rule -----------------
    #
    # `adjudicate::is_insufficient_material`'s (1,1) match arm guard is
    #   `bishops_w == 1 && bishops_b == 1 && knights_w_empty && knights_b_empty`
    # — four conjuncts. cargo-mutants generates three `&&` → `||` mutations.
    # The SECOND `&&` mutation is **provably equivalent** under all (1,1)
    # configurations: reaching (1,1) means each side has exactly one minor,
    # so `(bishops==1) == knights_empty` per side. Enumeration:
    #   - KB vs KB: original=T, mutated=(T&&T)||(T&&T)=T. SAME.
    #   - KB vs KN: original=F, mutated=(T&&F)||(T&&F)=F. SAME.
    #   - KN vs KB: original=F, mutated=(F&&T)||(F&&T)=F. SAME.
    #   - KN vs KN: original=F, mutated=(F&&F)||(F&&F)=F. SAME.
    # No regex rule is added because a function-anchored exclusion would
    # over-cover the FIRST and THIRD mutations (which ARE caught by
    # `not_insufficient_kbk_vs_kn_one_each` and `not_insufficient_kn_vs_kb_one_each`),
    # and a line-anchored exclusion would violate the project convention
    # against fragile line anchors. The second-mutant equivalent miss is
    # accepted permanently with this comment as the audit trail.

    # ---- ELOH.B: integration-only paths — subprocess/system-call-bound ----
    #
    # `production_worker_fn` spawns real engine subprocesses and drives UCI
    # handshake + per-pair flow over stdin/stdout pipes.  It is exercised
    # end-to-end by the `#[ignore]`-gated
    # `end_to_end_clawfish_self_play_concurrency_2` smoke (opt-in via
    # `cargo test --release -- --ignored`).  Unit-testable mocking would
    # require a fake EngineHandle infrastructure (deferred; out of scope for
    # ELOH.B).  Excluding here documents the structural gap explicitly.
    #
    # Two pattern forms (mirrors current_hostname/current_date_str): the
    # `in <fn>` form catches in-body operator/arithmetic mutations; the
    # `replace <fn> with` form catches whole-function-replacement mutants.
    # The function returns `()` so cargo-mutants generates `replace ... with ()`
    # without the `-> ()` arrow form. Surfaced by ELOH.C's mutants run.
    "in controller::production_worker_fn",
    "replace controller::production_worker_fn with",

    # `run_iteration` drain-loop boundary mutants are integration-only:
    #
    # The synthetic-worker controller tests cover happy-path dispatch, W/L/D
    # aggregation, and termination, but precise boundary distinctions in the
    # drain-loop dispatch gating require an integration harness with a mock
    # `EngineHandle`. **WHAT'S DEFERRED, SPECIFICALLY:**
    # - PGN write call site inside the `WorkerReport::GameComplete` arm
    #   (file-IO, exercised only by smoke).
    # - `summary::append_summary_line` call site (same — file-IO).
    # - The dispatch-loop's `pairs_dispatched < total_pairs` boundary: the
    #   synthetic tests pin happy-path counts but a `<` → `<=` mutant would
    #   over-dispatch by one. Catchable in principle by a synthetic test that
    #   asserts `pairs_dispatched == total_pairs` exactly at exit, but each
    #   such test requires bespoke channel-recording infrastructure.
    # - The `t < args.max_games` early-break guard at the top of the drain
    #   loop: ditto.
    # - In-flight-pair tracking math (`pairs_in_flight[wid] += 1`,
    #   `saturating_sub(1)`). Catchable but requires synthetic tests that
    #   record the per-worker dispatch sequence under interleaved completion.
    #
    # The cumulative effect: ~6 boundary mutants in this function survive
    # the cargo test suite. The deferral commitment is documented in
    # `docs/tooling-backlog.md` ("ELOH controller boundary testing — mock
    # EngineHandle harness for unit-testing dispatch-loop boundaries").
    # ELOH.C lands `--go-nodes` mode without touching this surface; the
    # deferral persists until a dedicated mock-engine test infrastructure
    # lands (estimated ~150 LOC of test scaffolding; out of scope here).
    "in controller::run_iteration",

    # `current_hostname` and `current_date_str` are system-call-bound
    # (gethostname; std::time::SystemTime).  They are exercised only via the
    # end-to-end smoke.  The calendar arithmetic helper
    # `unix_days_to_date_str` IS unit-tested (see `root_tests::unix_days_to_date_str_*`).
    # Two pattern forms: the "in <fn>" form catches in-body operator/arithmetic
    # mutations; the "replace <fn> ->" form catches whole-function-replacement
    # mutations that cargo-mutants generates (replacing the body with a literal
    # default like `String::new()` or `"xyzzy".into()`).
    "in current_hostname",
    "in current_date_str",
    "replace current_hostname ->",
    "replace current_date_str ->",

    # ---- ELOH.A: pgn/summary whole-fn and unrelated-line mutants -----------
    #
    # `pgn::format_pgn`'s body did not change in ELOH.B but the unit's diff
    # captured surrounding lines. Three move-pair-spacing boundary mutants
    # at `if i < moves.len()` (line 3161) survive `cargo test` because the
    # existing PGN golden-file fixture only exercises one specific even-move-
    # count game; the mutants flip behavior on different-length fixtures.
    # **WHAT'S DEFERRED, SPECIFICALLY:** the move-pair-spacing boundary at
    # `i < moves.len()`. Closing it cleanly would require a parametric fixture
    # sweep over move counts (1, 2, 3, 4, ...). The orchestrator chose to
    # exclude here rather than proliferate fixtures because ELOH.B's actual
    # surface is the harness, not the PGN formatter; the gap is pre-existing
    # ELOH.A scope captured by the diff. **TODO(eloh-c-or-d):** add a
    # parametric PGN move-count fixture sweep to close this gap; once added,
    # this exclusion can be removed. Until then the broad `in pgn::format_pgn`
    # exclusion is acceptable because the function is exercised end-to-end
    # by the smoke (which reads back PGN files) and any structural bug would
    # surface there.
    #
    # `summary::append_summary_line` whole-fn replacement (`-> Result<()> with
    # Ok(())`) is caught by the smoke (which reads back the file), not by
    # `cargo test --lib`. Same exclusion rationale as ELOH.A's
    # `in summary::append_summary_line` line.
    "in pgn::format_pgn",
    "replace summary::append_summary_line ->",

    # `main` is the binary entry point — only exercised by the binary's
    # run-time path; cannot be unit-tested in isolation.
    "replace main ->",

    # `<impl Drop for WorkerPool>::drop` clears the sender vec so workers see
    # `Disconnected` and exit naturally.  Every controller test constructs and
    # drops a `WorkerPool` (either via `synthetic_pool` or directly), so the
    # Drop impl runs on every test exit.  However, mutating `drop` to a no-op
    # (`()`) only changes *when* the channels close, not *whether* they close —
    # Rust's channel drop-on-last-sender semantics ensures workers exit at
    # pool-drop regardless.  The mutation is functionally equivalent under the
    # test surface (no test races on the exact moment of worker exit).
    # EXCLUDE as a structural-equivalent rather than adding a flaky timing test.
    #
    # **EQUIVALENCE DEPENDS ON: the Drop impl's body being only `senders.clear()`.**
    # If a future expansion adds OTHER work to `Drop::drop` (e.g., logging,
    # signaling a shutdown CV, joining handles, recording metrics), the
    # mutation would NO LONGER be equivalent because the additional work
    # wouldn't run under the no-op mutant. Re-evaluate this exclusion if
    # `Drop::drop`'s body grows beyond the current single statement.
    "<impl Drop for WorkerPool>::drop",

    # ---- ELOH.B: `clamp_uci_elo` boundary mutants — provably equivalent ---
    #
    # `clamp_uci_elo` (5 unit-tested boundary cases) clamps a rounded f64 to
    # `[UCI_ELO_MIN, UCI_ELO_MAX]`. Two surviving mutants are provably
    # equivalent:
    #
    #   `let rounded = elo.round();
    #    if rounded < MIN { MIN } else if rounded > MAX { MAX } else { rounded as u32 }`
    #
    # - `<` → `<=` at the lower-clamp guard:
    #   - rounded == MIN: original returns `MIN as u32` (via fall-through cast);
    #     mutant returns MIN. SAME.
    #   - rounded < MIN: both clamp to MIN. SAME.
    #   - rounded > MIN: both fall through to cast. SAME.
    # - `>` → `>=` at the upper-clamp guard: symmetric argument; rounded == MAX
    #   returns MAX either way; rounded > MAX clamps either way; rounded < MAX
    #   falls through either way.
    #
    # No real-valued input distinguishes the two operators. Permanent equivalent.
    # Function-anchored exclusion (catches both); the OTHER mutants in the
    # function (e.g. `< → ==`) are caught by the unit tests.
    #
    # **EQUIVALENCE DEPENDS ON: `elo.round()` preceding the clamp guard.**
    # `round()` always produces an integer-valued f64, which is what makes the
    # `rounded == MIN` case collapse to identical output (the cast and the
    # explicit clamp both yield MIN). Refactoring to `floor()` / `trunc()` /
    # direct cast would break this — non-integer rounded values would let the
    # `<` vs `<=` mutants diverge at fractional inputs near the boundary
    # (e.g. `1320.4 as u32 = 1320` but `1320.4 < 1320.0` is false vs
    # `1320.4 <= 1320.0` is false — wait, both false, so still equivalent for
    # this specific case). More precisely: the equivalence holds because for
    # any real `x ≥ MIN`, `x as u32` and "clamp at MIN" agree. The `.round()`
    # ensures the inputs to the clamp are well-behaved integer values; without
    # it, the cast could truncate fractional parts in a way that diverges from
    # the clamp at the boundary. Re-evaluate these exclusions if the rounding
    # step is changed.
    "replace < with <= in controller::clamp_uci_elo",
    "replace > with >= in controller::clamp_uci_elo",

    # ---- has_non_pawn_material: `|` ↔ `^` between provably-disjoint operands ----
    #
    # `pieces_colored(side, Knight) | pieces_colored(side, Bishop) | ...` ORs
    # four bitboards for Knight, Bishop, Rook, Queen. A square holds at most one
    # piece kind, so the four piece bitboards for a given color are disjoint by
    # the Position invariant (`piece_bb[k] & piece_bb[k'] == 0` for k ≠ k').
    # For disjoint sets: a | b == a ^ b for every input. Equivalent mutant.
    # M4.B+C+D+M5.A+B joint campaign; documented in docs/milestones/m5.a.md.
    "replace \\| with \\^ in has_non_pawn_material",

    # ---- negamax cancellation-cadence gate: `& → |` and `& → ^` ---------------
    #
    # `if self.nodes & 4095 == 0 && clock.should_abort(...)` at the per-frame
    # cancellation-cadence gate. The gate fires every 4096 nodes. Mutating to
    # `nodes | 4095 == 0` makes it NEVER fire (4095 has bits 0-11 set, so any
    # OR with it is always ≥ 4095). Mutating to `nodes ^ 4095 == 0` fires only
    # at nodes == 4095 exactly (once per search at that single count vs. every
    # multiple of 4096 in the original). Neither mutation fires within the test
    # suite: tests do not run enough nodes for either the per-4096 or the exact-
    # 4095 gate to trigger `should_abort`. Same equivalence argument as the
    # existing qsearch exclusion (`replace & with \\^ in AlphaBetaMover::qsearch`).
    # The stop-flag path inside `should_abort` is exercised directly by D11.
    # M4.B+C+D+M5.A+B joint campaign; documented in docs/milestones/m4.d.md.
    "replace & with \\| in AlphaBetaMover::negamax",
    "replace & with \\^ in AlphaBetaMover::negamax",

    # ---- negamax RFP gate: `beta.abs() < MATE_IN_MAX_PLY` boundary (`< → <=`) --
    #
    # `beta.abs() < MATE_IN_MAX_PLY` (= 29936) at the RFP gate. Mutating `<` to
    # `<=` would cause RFP to fire when `beta.abs() == 29936` exactly — a value
    # that no chess fixture produces (mate-in-MAX_PLY = mate-in-64 is longer than
    # any reachable game). Structurally undetectable at this milestone scope.
    # Expected survivor documented in docs/mutants-backlog.md §"Edge cases" and
    # docs/milestones/m5.b.md §"Mutation-survivor analysis". ADR-0024 §3 + M5.B
    # plan §10. Same argument as the M5.A NMP mate-cap `>=` → `>` boundary.
    "replace < with <= in AlphaBetaMover::negamax",

    # ---- negamax NMP recursive call: `ply + 1` → `ply * 1` --------------------
    #
    # `ply + 1` in the NMP null-search recursive call argument. Mutating to
    # `ply * 1` leaves `ply` unchanged (1 is the identity for multiplication).
    # The child receives `ply` instead of `ply + 1`, producing a 1-ply error in
    # mate-distance calculations and MDP bounds inside the null sub-search.
    # The observable effect is a 1-cp shift in mate scores returned from the null
    # sub-search, which is insufficient to straddle the MATE_IN_MAX_PLY cutoff
    # boundary (needed to change the NMP decision) for any reachable TT-stored
    # value. All existing NMP tests pin the cutoff-vs-beta relationship or the
    # firings count — not the exact mate magnitude — so the 1-ply shift is
    # invisible. Deferred to a future milestone (M5.C LMR or later) when
    # ply-sensitive search depth tests can be added with less combinatorial
    # complexity. M4.B+C+D+M5.A+B joint campaign; documented in
    # docs/milestones/m5.a.md §"Mutation-survivor analysis".
    "replace \\+ with \\* in AlphaBetaMover::negamax",

    # ---- go `tries` counter: `tries += 1` → `tries *= 1` ----------------------
    #
    # `tries += 1` in the aspiration loop's per-try increment. Mutating to
    # `tries *= 1` leaves tries = 0 permanently (identity multiplication). The
    # two-try cap `tries >= 2` never fires, allowing unlimited re-searches until
    # the window widens to (-INF, INF) and the search succeeds (at most 3 total
    # negamax calls per iteration vs the correct max of 2). The test AS10 is
    # designed to catch this via `aspiration_re_search` line counts ≤ 1, but the
    # existing `fail_high_fixture` only produces a single fail before the widened
    # window contains the score — so no iteration emits 2 re-search lines.
    # Constructing a guaranteed double-fail fixture requires a position with an
    # oscillating score (fail-high then fail-low), which is highly configuration-
    # dependent. The correctness impact is performance-only: at most one extra
    # full-width search per iteration, always terminating. Deferred to a future
    # phase (M5.C) when aspiration-window test infrastructure is expanded.
    # M4.B+C+D+M5.A+B joint campaign; documented in docs/milestones/m4.d.md
    # §"Mutation-survivor analysis".
    "replace \\+= with \\*= in <impl Search for AlphaBetaMover>::go",

    # ---- driver function whole-fn replacements (extend ELOH.A exclusion) ------
    #
    # The existing ELOH.A exclusions cover `in driver::*` patterns (in-body
    # operator mutations). cargo-mutants also generates whole-function
    # replacements of the form `replace <fn> -> <ReturnType> with <default>`.
    # For functions returning `Result<(), HarnessError>` the default is `Ok(())`;
    # for `Result<EngineCapabilities, HarnessError>` it is
    # `Ok(Default::default())`. These outer-wrapper functions delegate to inner
    # implementations that ARE covered by synthetic-channel unit tests. Making
    # the wrapper a no-op only breaks the bridge between the inner logic and the
    # real subprocess — detectable only by the `#[ignore]`-gated smoke test.
    # Same structural gap as the original ELOH.A exclusion.
    "replace driver::send_line ->",
    "replace driver::wait_for_uciok ->",
    "replace driver::wait_for_readyok ->",
    "replace driver::shutdown ->",

    # ---- get_hostname: whole-fn replacement ------------------------------------
    #
    # `get_hostname` is the FFI syscall wrapper used only by `current_hostname`.
    # Its in-body mutation `in get_hostname` is already excluded. cargo-mutants
    # also generates `replace get_hostname with ()` (returns the unit type since
    # the function returns `()`). Making the wrapper a no-op leaves `buf`
    # zero-filled so `current_hostname` returns "localhost" instead of the real
    # hostname — observable only via the end-to-end smoke test. `current_hostname`
    # and `current_date_str` are already excluded; extending the exclusion to
    # cover the whole-fn form.
    "replace get_hostname with",

    # ---- unix_days_to_date_str: two equivalent `-→+` survivors (no rule) ------
    #
    # Two `-→+` mutations survive the test suite but are provably equivalent:
    #
    # 1. Line ~9648: `((rem - rem / 1460) / 365).min(3)`. Mutating `-` → `+`:
    #    For rem ∈ [0, 1459]: rem/1460 = 0 → `rem - 0 == rem + 0`. Same result.
    #    For rem = 1460 (max): original = (1459/365).min(3) = 3;
    #    mutant = (1461/365).min(3) = 4.min(3) = 3. SAME (`.min(3)` absorbs the
    #    1-unit difference). Equivalent for all valid inputs.
    #
    # 2. Line ~9650: `rem - year_in_cycle * 365 - year_in_cycle / 4`. The SECOND
    #    `-` (before `year_in_cycle / 4`) mutated to `+`. year_in_cycle ∈ {0,1,2,3};
    #    integer division: year_in_cycle / 4 = 0 for all four values. So `- 0`
    #    and `+ 0` are identical. Equivalent.
    #
    # NO `exclude_re` rule is added because the function also has non-equivalent
    # `-→+` mutations (the first `-` on line ~9650, `rem - year_in_cycle*365`)
    # which ARE caught by the date-fixture tests. A function-level exclusion
    # `"replace - with + in unix_days_to_date_str"` would accidentally suppress
    # those caught mutations in future re-runs. A line-anchored exclusion would
    # violate the project convention against fragile line anchors.
    #
    # ACCEPTED AS PERMANENT EQUIVALENT MISSES. Audit trail: M4.B+C+D+M5.A+B
    # joint campaign (2026-05-02). See docs/milestones/m5.b.md for details.
]
