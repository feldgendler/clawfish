# cargo-mutants configuration. See https://mutants.rs/.
#
# Mutation testing answers "would the test catch a bug here?" by mutating
# the source (e.g. `+` → `-`, `<` → `<=`) and reporting which mutants
# survive the test suite. Surviving mutants point at gaps in test coverage.
#
# Run with: cargo mutants
#
# ===========================================================================
# Triaging a single survivor — manual mutation + targeted test
# ===========================================================================
#
# When a survivor is reported and you need to understand WHY a test fails to
# catch it (or to iterate on candidate fixtures), don't re-run the full
# `cargo mutants` suite each time — that burns ~an hour per pass.
#
# Instead: apply the mutation by hand via Edit, run only the suspect test(s),
# revert. Cycle time: seconds per iteration.
#
#   1. Edit the source file to apply the mutation (e.g., delete a `-`,
#      change `+` to `-`).
#   2. `cargo test --lib <test_name_pattern>`
#   3. Test passes against broken code → fixture fails to catch; iterate.
#      Test fails → caught.
#   4. Revert the mutation in source.
#
# Fall back to full `cargo mutants --in-diff` only to confirm the final test
# surface catches what it should.
#
# ===========================================================================
# `exclude_re` rules — don't anchor on line numbers
# ===========================================================================
#
# `exclude_re` patterns match against cargo-mutants' display name for each
# mutant (typically `<file>:<line>:<col>: <op> in <function>`). It's tempting
# to disambiguate two same-shape mutants in the same function (e.g. two
# `delete -` mutants in `qsearch`) by anchoring the regex to a specific
# `:<line>:<col>:` prefix. DON'T.
#
# Line-anchored exclusions are fragile to refactoring:
#   - Any unrelated edit that shifts the line silently breaks the exclusion
#     (no error — the rule simply matches no mutant).
#   - A different mutation at the same line silently gets excluded
#     (false-negative).
# The exclusion's intent rots invisibly.
#
# Better approaches, in order of preference:
#
#   1. REFACTOR the bug-prone pattern into a named helper. When two same-
#      shape mutants in the same function are genuinely different bugs,
#      extracting one into a separate function gives cargo-mutants two
#      distinct function names. More importantly, the named helper is
#      directly unit-testable in isolation — often the structural reason
#      the mutation was hard to catch is *because* the bug-prone code is
#      mixed in with surrounding logic. M3.D's `negate_window(alpha, beta)`
#      precedent: the `(-beta, -alpha)` open-coded bound-negation in
#      qsearch's recursive call had two `delete -` mutations that were
#      structurally undetectable at the qsearch integration level (1-2
#      plies of recursion is too shallow to expose the effect). Extracting
#      `negate_window` made both mutations catchable by a 5-line
#      pure-function test.
#   2. Anchor on a distinctive token in the mutant's display (if cargo-
#      mutants surfaces source context).
#   3. Wrap the bug-prone call in a uniquely-named `#[inline]` shim function.
#   4. Document the gap explicitly and accept the over-filter — last resort.
#
# Avoid:
#   - `:<line>:<col>:` anchors. Line numbers shift on any edit.
#   - Broad function-level patterns (`<op> in <function>`) when the function
#     has multiple mutants of the same shape but different semantic targets
#     — the rule will silently over-filter sibling mutants.

# ---- Per-mutant test timeout cap ------------------------------------------
# cargo-mutants auto-sets the per-mutant test timeout from the baseline run ×
# a default 5× multiplier. Our baseline (lib + integration) is ~384 s, so the
# auto-timeout lands at ~1922 s (≈ 32 min) — and any mutant that makes a test
# HANG (e.g. gutting `negamax` to `return 0` sends an ID-loop test infinite)
# burns that full 32 min before it is killed. Observed live in the M8.A.1
# in-diff run: 4 timeout mutants each ran `~2 s build + 1922 s test`, ~2 h of
# the run. On a larger diff with many hanging mutants this is the ~12 h
# pathology.
#
# Cap the multiplier at 2× (~768 s). This is SAFE w.r.t. the 0-missed gate:
# only two cases run long — (1) a SURVIVOR runs the full passing suite once
# (≈ baseline ~384 s ≪ 768 s, no false timeout), (2) a HANG runs unbounded
# (killed at 768 s). Caught mutants return as soon as the first test fails
# (often seconds), unaffected. A timeout is classified "timeout", never
# "missed", so even an over-tight cap cannot manufacture a false survivor —
# worst case a slow-but-caught mutant lands in the timeout bucket (which we
# already treat as timeout-caught). Tighten toward ~1.5× only after observing
# that no healthy survivor runs near the cap. The bigger lever (deferred —
# see docs/tooling-backlog.md) is shrinking the baseline itself (the
# integration suite dominates the 384 s).
timeout_multiplier = 2.0

# ---- File-level exclusions ------------------------------------------------
exclude_globs = [
    # Auto-generated constants. The data is verified end-to-end by the
    # gold-standard differential test in tests/magic_consistency.rs;
    # mutating individual hex literals would just produce noise.
    "src/magic/constants.rs",

    # The magicgen binary is a codegen tool, not engine code. It runs its
    # own validate() pass on every invocation and is not exercised by
    # cargo test, so every mutation here would survive trivially.
    "src/bin/magicgen.rs",

    # The mock-engine binary is a test fixture for `production_worker_fn`
    # UCI-ordering tests (`mod controller::tests::production_worker_tests`).
    # Not engine code; mutating it would not surface a real defect, only
    # break the fixture's UCI replies and produce noise. Same precedent as
    # `magicgen.rs`. See `docs/plans/tooling-mock-engine-fixture.md`.
    "src/bin/mock_engine.rs",

    # Stub entry point — println! only, nothing meaningful to mutate.
    "src/main.rs",

    # Vendored PeSTO middlegame evaluation data (M3.A): MATERIAL constants
    # plus six MG_*_PST tables. Same precedent as src/magic/constants.rs.
    # Mutation testing on negative literals would generate ~185 `delete -`
    # survivors that the structural symmetry test (B1 in src/eval.rs) is
    # invariant under (sign-flips on both color sides cancel). End-to-end
    # validation lives at higher layers — the published PeSTO source is
    # authoritative, and SPRT vs RandomMover (M3.F) plus the smoke games in
    # scripts/match.sh exercise the data in actual play.
    "src/eval/data.rs",
]

# ---- Mutant-level exclusions (by name regex) ------------------------------
#
# Patterns key on the mutant's `replace ... in <function>` form and so are
# robust to line moves within a function. Each block documents *why* the
# mutant is genuinely indistinguishable from the original — i.e. the test
# suite cannot catch it because no input differentiates the two operators
# (an "equivalent mutant" in mutation-testing terminology).
exclude_re = [
    # `replace <fn> -> () with ()` — no-op for unit-returning functions.
    "replace .* -> \\(\\) with \\(\\)",

    # ---- M7.B/M7.B.2 qsearch SEE-pruning: `< → <=` is equivalent at every ----
    # ---- reachable threshold -----------------------------------------------
    #
    # `see(pos, mv) < threshold` vs `<=` differ only when `see() == threshold`
    # exactly. M7.B.2 makes `threshold` the depth-conditioned
    # `qs_see_prune_threshold(root_depth)` ∈ {0, −16, −32, −48, −64}. The prune
    # predicate only reaches the `see()` call when `attacker > victim` (the
    # `victim >= attacker` fast-out returns early otherwise). With the integer
    # SEE_VALUE set [82,337,365,477,1025,30000], no `attacker > victim` exchange
    # nets exactly 0 (requires victim == attacker → fast-out) NOR any of the
    # non-zero reachable thresholds (multiples of SLOPE=16: the achievable
    # losing-exchange values −28,−112,−140,−255,−283,−395,−548,−660,−688,−943,…
    # are none of {−16,−32,−48,−64}). So no position can distinguish `<` from
    # `<=`. Equivalent mutant (ADR-0040 §6). See the §5.3 analysis comment in
    # search.rs.
    "replace < with <= in qsearch_see_pruneable",

    # ---- `|` ↔ `^` between provably-disjoint operands -----------------
    #
    # These functions OR together bitboards (or single-bit integer values)
    # that are disjoint by construction. For disjoint a, b: a | b == a ^ b
    # for every input, so no test can distinguish the two operators.

    # slow_attacks: each ray-combiner ORs four directional rays from one
    # square. The rays cover distinct cardinal/diagonal squares — they
    # never overlap (this is why a slider's attack set is the disjoint
    # union of its rays).
    "replace \\| with \\^ in rook_mask",
    "replace \\| with \\^ in bishop_mask",
    "replace \\| with \\^ in rook_attacks",
    "replace \\| with \\^ in bishop_attacks",
    # queen_attacks (both slow_attacks and magic) ORs rook-attacks with
    # bishop-attacks; rook attacks file/rank squares while bishops attack
    # diagonal squares — the two sets are always disjoint.
    "replace \\| with \\^ in queen_attacks",

    # Position::starting_position composes disjoint piece bitboards (each
    # piece type's white set is on rank 1, black set on rank 8; pawns on
    # rank 2/7) and disjoint rank ORs (RANK_1 | RANK_2, RANK_7 | RANK_8).
    "replace \\| with \\^ in Position::starting_position",

    # White-occupancy and black-occupancy are disjoint by definition —
    # no piece is both colors.
    "replace \\| with \\^ in Position::occupied_all",
    "replace \\| with \\^ in Position::debug_assert_consistent",

    # ---- ray_mask: first off-board guard `||` ↔ `&&` ------------------
    #
    # ray_mask exits the loop on either guard:
    #   if !(0..8).contains(&nf) || !(0..8).contains(&nr) { return acc; }
    #   ...
    #   if !(0..8).contains(&beyond_f) || !(0..8).contains(&beyond_r)
    #     { return acc; }
    # Mutating the FIRST guard's `||` to `&&` only matters if the first
    # guard would have fired but the second won't — which is impossible:
    # `beyond` is always one step further along (dfile, drank), so
    # whichever axis went off-board is more off-board on the next step,
    # and the second `||` (unchanged) catches it before
    # Square::from_file_rank is reached. So no input distinguishes.
    "replace \\|\\| with && in ray_mask",

    # ---- magic table-build destructive-collision check ---------------
    #
    # The committed magic constants produce a perfect-hash mapping for
    # every (square, subset) pair: each subset hits a unique slot, so the
    # `existing != 0` branch is never taken during table build with our
    # seed (0xC0FFEE_C0FFEE). The `panic!` guards a hypothetical corrupted
    # constants file. Since the branch is unreachable in practice, mutating
    # `!=` → `==` produces an equivalent mutant: both forms are unreachable,
    # and the test suite cannot distinguish them. (Keep the runtime check;
    # it's a cheap defense against future regeneration with a non-perfect
    # magic.)
    "replace != with == in build_rook_table",
    "replace != with == in build_bishop_table",

    # ---- masks: opponent rook+queen / bishop+queen unions ------------
    #
    # `pos.pieces_colored(c, Rook) | pos.pieces_colored(c, Queen)` ORs two
    # bitboards that share zero bits (a square holds a rook OR a queen,
    # not both). Same for bishop+queen. Disjoint by construction → `|` ≡
    # `^` for every input. Same applies to the assemble of pawn-attack
    # shifts inside `compute_attacked_squares` (NW and NE shifts are
    # never the same square because they differ in file by 2).
    "replace \\| with \\^ in checkers_of",
    "replace \\| with \\^ in compute_attacked_squares",
    "replace \\| with \\^ in MaskInfo::compute",
    "replace \\| with \\^ in emit_pawn_moves",

    # ---- see::{attackers_to, see} — disjoint-by-construction unions (M7.A) -
    #
    # Every binary `|` in `attackers_to` and `see` ORs bitboards that share
    # zero bits:
    #   - `(pawn_attacks_from(sq,Black) & white_pawns) | (… & black_pawns)`:
    #     a square holds at most one color of pawn → the two operands are
    #     disjoint.
    #   - `Bishop | Queen` (bishop_like) and `Rook | Queen` (rook_like): a
    #     square holds one piece kind, never both.
    #   - the final `pawn | knight | diag | orth | king` union (attackers_to)
    #     and the x-ray rescan `bishop_attacks(to)&bishop_like |
    #     rook_attacks(to)&rook_like` (see): distinct piece types occupy
    #     distinct squares, and a queen attacks `to` via at most ONE of the
    #     diagonal (diag) / orthogonal (orth) rays (a square is on a diagonal
    #     XOR a rank/file relative to the queen) → diag and orth are disjoint.
    # For disjoint a,b: `a | b == a ^ b` for every input ⇒ no test can
    # distinguish `|` from `^`. Same equivalent-mutant class as the masks /
    # slow_attacks unions above. NOTE: these patterns match the binary `|`
    # only — `see`'s x-ray-accumulating `attackers |= …` is NOT disjoint
    # (revealed sliders overlap the running set) and is correctly caught.
    "replace \\| with \\^ in attackers_to",
    "replace \\| with \\^ in see",

    # ---- masks::is_slider_at — equivalent on knight/pawn checker -----
    #
    # `is_slider_at` is consumed only inside MaskInfo::compute's
    # single-checker branch to pick `push_mask = between_bb(king,
    # checker)` vs `EMPTY`. For knight or pawn checkers (the only
    # non-slider checkers), the checker is never on a rank/file/diagonal
    # ray from the king at >1 distance — knight checks are L-jumps;
    # pawn checks are diagonally adjacent. In both cases `between_bb`
    # returns EMPTY regardless of `is_slider_at`, so mutating the fn to
    # always return `true` doesn't affect the resulting mask. Equivalent.
    "replace is_slider_at -> bool with true",

    # ---- knight/king attack-table builders: `+` ↔ `-` on symmetric deltas ----
    #
    # `build_knight_attacks` and `build_king_attacks` both iterate over a
    # deltas array that is closed under negation (knight: {(±2,±1),(±1,±2)};
    # king: {(±1,0),(0,±1),(±1,±1)}). Mutating `file + df` → `file - df` (or
    # the rank counterpart) only swaps which delta produces which target;
    # the SET of (target_file, target_rank) pairs is invariant under
    # negation of df (or dr). The resulting attack table is byte-identical,
    # and no test can distinguish. (Pawn-attack table is NOT in this class:
    # its offsets are constant per direction, not drawn from a closed-under-
    # negation set.)
    "replace \\+ with - in build_knight_attacks",
    "replace \\+ with - in build_king_attacks",

    # ---- TtEntry::pack_age_bound: `(age & 0x3F) << 2 | bound` disjoint ----
    #
    # `pack_age_bound(age, bound) = (age & 0x3F) << 2 | bound as u8`.
    # The left operand lives in bits [7..2] (age, 6 bits), the right in
    # bits [1..0] (bound, 2 bits). They have disjoint bit positions by
    # construction, so `|` and `^` produce identical results for every
    # input. Equivalent mutant; M4.A.
    "replace \\| with \\^ in TtEntry::pack_age_bound",

    # ---- emit_*_moves: `capture_mask | push_mask` is disjoint -----
    #
    # The single-check / no-check / double-check formulas guarantee
    # `capture_mask` and `push_mask` are always disjoint:
    #   - no check:    capture = enemy_occupied, push = empty_squares (∅ overlap)
    #   - single check: capture = {checker_sq}, push = between_bb(king, checker)
    #     (between excludes endpoints, so checker_sq ∉ between)
    #   - double check: both EMPTY
    # So `mask | mask` ≡ `mask ^ mask` for every emit. Equivalent.
    "replace \\| with \\^ in emit_knight_moves",
    "replace \\| with \\^ in emit_slider_moves",

    # ---- pawn.rs: 2 * push_dr equivalent under push_dr ∈ {-1, +1} ----
    #
    # `(from_rank as i8 + 2 * push_dr) as u8` is the double-push target
    # rank. push_dr is hardcoded to ±1. For x ∈ {-1, +1}: 2 * x == 2 / x
    # (both yield ±2). Equivalent for the only inputs that ever appear.
    "replace \\* with / in emit_pawn_moves",

    # ---- AlphaBetaMover::qsearch — assignment guards equivalent on equality
    #
    # Several guards in qsearch fire on strict greater-than:
    #   `if sp > alpha { alpha = sp; }`     (stand-pat alpha-tightening, L547)
    #   `if score > best { best = score; }` (move-loop best-tracking, L599)
    #   `if score > alpha { alpha = score; }` (move-loop alpha-tightening, L601)
    # Mutating `>` to `>=` makes the guard fire on equality too. But on
    # equality, the assignment is a no-op (alpha = alpha is identity, etc.),
    # so the post-condition is identical. No test input can distinguish.
    # The same `>=` variant of `>` and the `==`-only mutant for `sp > alpha`
    # are also equivalent for this reason.
    "replace > with >= in AlphaBetaMover::qsearch",
    "replace > with == in AlphaBetaMover::qsearch",

    # ---- AlphaBetaMover::qsearch — MD-pruning trigger boundary ---------
    #
    # `if mating_value < beta { beta = mating_value; if alpha >= mating_value { return mating_value; } }`
    # at L516. Mutating `<` to `<=` makes the outer guard fire when
    # mating_value == beta. In that case the inner `beta = mating_value`
    # assignment is a no-op (beta == beta), and the inner check
    # `alpha >= mating_value` is a function of (alpha, mating_value) only —
    # unchanged. So `<` ≡ `<=` here.
    "replace < with <= in AlphaBetaMover::qsearch",

    # ---- AlphaBetaMover::qsearch — cancellation cadence operator ------
    #
    # `if self.nodes & 4095 == 0 && ctx.should_abort(...)` at L506. Mutating
    # `&` to `^` switches the gate's predicate. Both gates are inert under
    # the test surface: `n & 4095 == 0` fires only when nodes is a multiple
    # of 4096; `n ^ 4095 == 0` fires only when nodes equals 4095 exactly.
    # M3.D tests don't run long enough to reach either set, so neither
    # version of the gate ever triggers ctx.should_abort within the test
    # suite. The same `&` cadence is also present in negamax (M3.C
    # precedent — also untreated by an exclusion since no test distinguishes).
    "replace & with \\^ in AlphaBetaMover::qsearch",

    # ---- ELOH.A: integration-only paths — smoke-test exercised ----------
    #
    # The Elo-iteration harness (`src/bin/elo-iterate.rs`) has substantial
    # surface that is structurally only reachable through `main()` orchestrating
    # real subprocess pairs over stdin/stdout pipes. Unit tests cover the
    # pure helpers (CLI parser, adjudicate, PGN formatter, time-clock
    # arithmetic, parser line-by-line) — but `main`, `play_one_game`, the
    # post-handshake `wait_for_uciok`/`wait_for_readyok` drains, the `shutdown`
    # subprocess teardown, `send_line` writeline-with-flush, and
    # `append_summary_line` file-IO are exercised end-to-end by the
    # `#[ignore]`-gated `e2e_smoke::end_to_end_clawfish_self_play_4_games`
    # plus the manual back-test (200 games vs Stockfish UCI_Elo=1320 archived
    # in `docs/research/tooling-elo-harness-validation.md`).
    #
    # Mutating any of these to a degenerate `Ok(())` / no-op / sign-flip is
    # caught by the smoke test (which the integration coverage gate runs
    # manually before each ELOH milestone closure) but NOT by `cargo test`.
    # `cargo mutants --in-diff` therefore reports them as missed under the
    # default test invocation. Excluding them here documents the structural
    # gap explicitly. The complementary tests remain the smoke + manual
    # back-test; ELOH.B is expected to add a non-ignored mini-smoke (one
    # 2-game self-play) to close part of this gap.
    "in match_loop::play_one_game",
    "in main$",
    "in driver::wait_for_uciok",
    "in driver::wait_for_readyok",
    "in driver::shutdown$",
    "in driver::send_line",
    "<impl Drop for EngineHandle>",
    "in summary::append_summary_line",
    "in get_hostname",
    "in cli::<impl std::fmt::Display for CliError>::fmt",

    # ---- ELOH.A: documentation comment, NOT a regex rule -----------------
    #
    # `adjudicate::is_insufficient_material`'s (1,1) match arm guard is
    #   `bishops_w == 1 && bishops_b == 1 && knights_w_empty && knights_b_empty`
    # — four conjuncts. cargo-mutants generates three `&&` → `||` mutations.
    # The SECOND `&&` mutation is **provably equivalent** under all (1,1)
    # configurations: reaching (1,1) means each side has exactly one minor,
    # so `(bishops==1) == knights_empty` per side. Enumeration:
    #   - KB vs KB: original=T, mutated=(T&&T)||(T&&T)=T. SAME.
    #   - KB vs KN: original=F, mutated=(T&&F)||(T&&F)=F. SAME.
    #   - KN vs KB: original=F, mutated=(F&&T)||(F&&T)=F. SAME.
    #   - KN vs KN: original=F, mutated=(F&&F)||(F&&F)=F. SAME.
    # No regex rule is added because a function-anchored exclusion would
    # over-cover the FIRST and THIRD mutations (which ARE caught by
    # `not_insufficient_kbk_vs_kn_one_each` and `not_insufficient_kn_vs_kb_one_each`),
    # and a line-anchored exclusion would violate the project convention
    # against fragile line anchors. The second-mutant equivalent miss is
