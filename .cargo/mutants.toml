    # several (depth, quiet_index) tuples that the clamp does NOT absorb.
    # Function-anchored to survive any future formula refactor that keeps
    # the `*` between `ln(depth)` and `ln(quiet_index)`.
    "replace \\* with \\+ in late_move_reduction",
    "replace \\* with / in late_move_reduction",

