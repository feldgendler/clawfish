[package]
name = "clawfish"
version = "0.1.0"
edition = "2024"
description = "Standard chess engine"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# POSIX `clock_gettime(CLOCK_THREAD_CPUTIME_ID)` shim for the `VirtualClock`
# UCI option (ELOH.C / ADR-0019). Used only by `src/search.rs::read_thread_cpu_ns`,
# gated `#[cfg(unix)]`. MIT/Apache-2.0 licensed; covered by `deny.toml`.
libc = "0.2"

# M6.I Texel tuning harness (`src/texel/`, `texel-tune` bin). General-purpose
# serialization — used for `bench/m6-params.json` and the optimizer checkpoint
# (ADR-0037 §9/§10). Engine binary links these too (no feature gate needed),
# but they are not on the `evaluate`/search hot path. `cargo deny`/`audit`
# after the dep change.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# M6.H corpus-fetch network stack. ALL gated behind the non-default
# `corpus-fetch` feature (see [features] below) so the engine binary and its
# `cargo audit`/`cargo deny`/build are unaffected — only the `corpus` CLI's
# `fetch` subcommand pulls these. See docs/plans/m6.h.md §2, ADR-0036.
# ureq: sync HTTP client; `platform-verifier` uses the OS trust store (macOS
# Security framework) — no static webpki-roots, no `gzip` transport feature
# (we decompress payloads ourselves). zstd: streaming Zstandard decoder for
# Lichess `.pgn.zst` (vendors libzstd; build-time C compiler only). zip:
# CCRL `.zip` (deflate-only; download-to-temp + ZipArchive).
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
zstd = { version = "0.13", optional = true }
# sevenz-rust2: pure-Rust 7z decompressor (LZMA/LZMA2 — what CCRL uses). CCRL
# distributes ONLY as .7z, so this is the on-demand CCRL path. Apache-2.0.
sevenz-rust2 = { version = "0.21", optional = true }

[features]
# Non-default: enables the `corpus fetch` network ingestion path (M6.H).
# Build/test it with `--features corpus-fetch`; the engine builds without it.
corpus-fetch = ["dep:ureq", "dep:zip", "dep:zstd", "dep:sevenz-rust2"]


[dev-dependencies]
# Property-based testing. Used in unit tests (modules under `#[cfg(test)]`)
# and integration tests under `tests/`. Stable-Rust only — no nightly.
proptest = "1.11"
# Microbenchmarks. See ADR-0010 (`docs/decisions/0010-benchmark-baseline-format.md`).
# Used by `benches/perft.rs` and `benches/movegen.rs`.
criterion = { version = "0.7", features = ["html_reports"] }

[[bin]]
name = "elo-iterate"
path = "src/bin/elo-iterate.rs"

[[bin]]
name = "epd-suite"
path = "src/bin/epd-suite.rs"

# Test fixture: minimal UCI mock engine that records every received command to
# a file for unit-testing `controller::production_worker_fn`'s UCI ordering.
# Not a real engine — see `src/bin/mock_engine.rs` and
# `docs/plans/tooling-mock-engine-fixture.md`.
[[bin]]
name = "mock-engine"
path = "src/bin/mock_engine.rs"

# M6.G corpus-construction CLI (data infra; no engine-behavior change).
# See docs/plans/m6.g.md, ADR-0035.
[[bin]]
name = "corpus"
path = "src/bin/corpus.rs"

# M6.I Texel tuning harness CLI. Consumes the frozen corpus lanes, tunes the
# deferred eval weights, writes `bench/m6-params.json`. Standalone consumer —
# does NOT touch `evaluate`/search. See docs/plans/m6.i.md, ADR-0037.
[[bin]]
name = "texel-tune"
path = "src/bin/texel-tune.rs"

[[bench]]
name = "perft"
harness = false

[[bench]]
name = "movegen"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Optimized build WITH integer-overflow checks, used by CI to run the FULL test
# suite (`cargo nextest run --cargo-profile release-checked`). Optimized so the
# heavy self-play integration tests run in seconds (a debug build makes them tens
# of seconds and contention-sensitive — that slowness is largely the per-move
# `debug_assert_consistent` scan). overflow-checks kept ON so the optimized run
# still catches integer overflow. The production `release` profile above is
# untouched (no engine perf cost). `panic = "abort"` is inherited but cargo forces
# `unwind` for test/bench targets, so `#[should_panic]` tests work.
#
# NOTE: this profile does NOT restore `debug-assertions` (inherited `false` from
# release) — so `debug_assert!`/`debug_assert_consistent` and the
# `#[cfg(debug_assertions)]` guard tests are compiled out of this run. That
# coverage is kept by a separate fast DEBUG `cargo nextest run --lib` step in CI
# (.github/workflows/ci.yml). Do NOT just set `debug-assertions = true` here — it
# would re-enable the per-move scan and re-slow the heavy integration tests,
# defeating the profile's purpose.
[profile.release-checked]
inherits = "release"
overflow-checks = true
